name: Python CI

# Run checks when a PR targets main or when main receives a push.
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

# Give the workflow read-only access to repository contents.
permissions:
  contents: read

# Cancel older runs when a newer run starts for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality-check:
    name: Python Quality and Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Download the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python 3.11.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Install the project's dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Check Python syntax in the project directories.
      - name: Compile Python files
        run: |
          python -m compileall -q games.py starter evaluation

      # Run the project's evaluation system.
      - name: Run evaluation
        run: python evaluation/run_evaluation.py
